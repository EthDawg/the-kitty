name: iOS host
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Check deterministic project
        run: |
          python3 ios/scripts/generate_project.py
          git diff --exit-code -- ios/Kitty.xcodeproj
      - name: Bundle shared offline page and brand icon
        run: python3 ios/scripts/prepare_resources.py
      - name: Choose available iPhone simulator
        run: |
          xcrun simctl list devices available -j > /tmp/kitty-simulators.json
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json
          devices = json.load(open('/tmp/kitty-simulators.json'))['devices']
          phone = next(d for runtime, values in devices.items() if '.iOS-' in runtime for d in values if d['name'].startswith('iPhone'))
          print('KITTY_SIMULATOR_ID=' + phone['udid'])
          PY
      - name: Build and test offline host
        timeout-minutes: 10
        run: |
          mkdir -p ios/build
          set -o pipefail
          xcodebuild -project ios/Kitty.xcodeproj -scheme Kitty \
            -configuration Debug -destination "platform=iOS Simulator,id=$KITTY_SIMULATOR_ID" \
            -derivedDataPath ios/build/DerivedData \
            -resultBundlePath ios/build/offline.xcresult \
            -parallel-testing-enabled NO -maximum-concurrent-test-simulator-destinations 1 \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 60 \
            -maximum-test-execution-time-allowance 90 \
            CODE_SIGNING_ALLOWED=NO test 2>&1 | tee ios/build/build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-build-evidence
          path: |
            ios/build/build.log
            ios/build/offline.xcresult
          if-no-files-found: ignore
          retention-days: 7

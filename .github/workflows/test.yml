name: test
# Every check lives in check.py, so a fresh clone and CI run the same thing. Add a check there, not here.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 check.py --ci test

  standard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 check.py --ci standard

  portals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: npm ci
        working-directory: portals
      - run: npx playwright install --with-deps chromium
        working-directory: portals
      - run: python3 check.py --ci portals
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: portals/playwright-report, retention-days: 7 }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: kit-screenshots, path: docs/screenshots/kit/ci, if-no-files-found: ignore, retention-days: 7 }

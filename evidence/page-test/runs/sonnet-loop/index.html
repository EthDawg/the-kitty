<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>How we're going</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f5f2; --card:#ffffff; --ink:#1d1f24; --mute:#5b6070; --line:#e3e1db; --soft:#efede8;
  --accent:#4b3fd1; --accent-ink:#ffffff;
  --good:#17703f; --good-bg:#e3f3ea; --warn:#8a5a00; --warn-bg:#fbefd2; --bad:#a3262a; --bad-bg:#fbe3e2;
  --inc:#2f7d6d; --exp:#b0643a; --cl:46%;
  --shadow:0 1px 2px rgba(20,20,30,.06);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#121317; --card:#1b1d23; --ink:#eceef3; --mute:#a2a8b8; --line:#2c2f38; --soft:#23262e;
    --accent:#9a90ff; --accent-ink:#14122e;
    --good:#6fd39b; --good-bg:#17322499; --warn:#f0c15a; --warn-bg:#3a2f12; --bad:#ff8f8c; --bad-bg:#40191a;
    --inc:#5cc2ae; --exp:#e69a70; --cl:66%;
    --shadow:none; color-scheme:dark;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums;padding:0 max(16px,env(safe-area-inset-right)) 48px max(16px,env(safe-area-inset-left))}
.wrap{max-width:1080px;margin:0 auto}
h1,h2,h3,p{margin:0}
header{padding:24px 0 8px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;justify-content:space-between}
h1{font-size:22px;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--mute);font-size:14px}
.asof{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px;color:var(--mute)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;font-size:13px;font-weight:600;line-height:22px;background:var(--soft);color:var(--ink);white-space:nowrap}
.chip.good{background:var(--good-bg);color:var(--good)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip.est{background:transparent;border:1px dashed var(--mute);color:var(--mute)}
section{margin-top:32px}
h2{font-size:18px;font-weight:700;margin-bottom:4px}
.lead{color:var(--mute);font-size:14px;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow)}
.verdict{margin-top:12px;padding:20px}
.verdict h2{font-size:28px;line-height:1.2;letter-spacing:-.02em;margin:0 0 4px}
.verdict .why{font-size:16px;color:var(--mute)}
.need{list-style:none;margin:16px 0 0;padding:0;display:grid;gap:8px}
.need li{margin:0}
.need a{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:start;padding:12px;border-radius:10px;background:var(--soft);color:inherit;text-decoration:none;min-height:64px}
.need a:hover{outline:2px solid var(--line)}
.need b{display:block;font-size:16px}
.need span.t{color:var(--mute);font-size:14px}
.need .n{width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--card);display:grid;place-items:center;font-weight:700;font-size:14px}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:12px}
.tile{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-rows:auto auto auto 1fr;gap:4px;padding:16px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);min-height:148px;text-align:left}
.tile:hover{border-color:var(--mute)}
.tile:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.tile .k{font-size:14px;color:var(--mute);font-weight:500;display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.tile .v{font-size:32px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.tile .c{font-size:14px;color:var(--mute)}
.tile .more{font-size:14px;color:var(--accent);font-weight:600;align-self:end}
.good-t{color:var(--good)} .bad-t{color:var(--bad)}
.goal{padding:16px}
.goal+.goal{margin-top:12px}
.row{display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap}
.row .big{font-size:20px;font-weight:700}
.bar{height:10px;background:var(--soft);border-radius:999px;overflow:hidden;margin:10px 0 8px}
.bar>i{display:block;height:100%;border-radius:999px;background:var(--accent);transform-origin:left;animation:grow .7s ease-out both}
.bar>i.ok{background:var(--good)} .bar>i.over{background:var(--bad)}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:12px;align-items:start}
.list{list-style:none;margin:0;padding:0}
.list li{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:12px 0;border-top:1px solid var(--line);min-height:56px;align-items:center}
.list li:first-child{border-top:0}
.list .nm{display:flex;gap:8px;align-items:center;min-width:0;font-weight:500;overflow-wrap:anywhere}
.list .amt{text-align:right;font-weight:600;white-space:nowrap}
.list .det{grid-column:1/-1;color:var(--mute);font-size:14px}
.dot{width:12px;height:12px;border-radius:4px;flex:none;background:hsl(var(--h) 58% var(--cl))}
details{margin-top:8px}
summary{cursor:pointer;font-weight:600;color:var(--accent);padding:10px 0;min-height:44px;display:flex;align-items:center}
.chart{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;align-items:end;height:170px;padding-top:8px}
.chart .m{display:flex;flex-direction:column;align-items:center;justify-content:end;height:100%;min-width:0}
.chart .bars{display:flex;gap:2px;align-items:end;height:calc(100% - 24px);width:100%;justify-content:center}
.chart .bars i{display:block;width:40%;max-width:18px;border-radius:3px 3px 0 0;min-height:2px}
.chart .inc{background:var(--inc)} .chart .exp{background:var(--exp)}
.chart .lb{font-size:13px;color:var(--mute);height:24px;line-height:24px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;color:var(--mute);margin-top:8px}
.legend span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px;background:var(--c)}
svg.line{width:100%;height:120px;display:block}
.table{width:100%;border-collapse:collapse;font-size:15px}
.table th,.table td{padding:10px 8px;border-top:1px solid var(--line);text-align:right;vertical-align:top}
.table th:first-child,.table td:first-child{text-align:left;padding-left:0;overflow-wrap:anywhere}
.table th:last-child,.table td:last-child{padding-right:0}
.table thead th{border-top:0;color:var(--mute);font-weight:600;font-size:14px}
.table tr.sum td{font-weight:700}
.scroll{overflow-x:auto}
.empty{padding:16px;border:1px dashed var(--line);border-radius:10px;color:var(--mute);text-align:center}
.fail{padding:16px;border:1px solid var(--bad);border-radius:10px;color:var(--bad);background:var(--bad-bg)}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--ink);padding:0;width:min(560px,calc(100vw - 32px));max-height:min(86vh,720px);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(10,10,20,.55)}
.dh{display:flex;justify-content:space-between;gap:12px;align-items:start;padding:20px 20px 8px;position:sticky;top:0;background:var(--card)}
.dh h3{font-size:18px}
.dh button{all:unset;cursor:pointer;min-width:44px;min-height:44px;display:grid;place-items:center;border-radius:10px;background:var(--soft);font-weight:600;padding:0 12px;box-sizing:border-box}
.dh button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.db{padding:4px 20px 20px}
.db .big{font-size:34px;font-weight:700;letter-spacing:-.02em}
.src{margin-top:12px;color:var(--mute);font-size:14px}
footer{margin-top:40px;color:var(--mute);font-size:14px}
@media (max-width:520px){
  h1{font-size:20px}
  .verdict h2{font-size:24px}
  .tile .v{font-size:30px}
  .list li{grid-template-columns:1fr}
  .list .amt{text-align:left}
  .chart{gap:2px}
}
@media (prefers-reduced-motion:reduce){.bar>i{animation:none}*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>

</dialog>

<script>
(function(){
'use strict';
var D;

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function arr(k){return D&&Array.isArray(D[k])?D[k]:[];}
function num(x){return typeof x==='number'&&isFinite(x);}
var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var MONL=['January','February','March','April','May','June','July','August','September','October','November','December'];
function pd(s){var m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s||'');return m?new Date(Date.UTC(+m[1],+m[2]-1,+m[3])):null;}
function fd(s){var d=pd(s);return d?d.getUTCDate()+' '+MON[d.getUTCMonth()]+' '+d.getUTCFullYear():'';}
function fdShort(s){var d=pd(s);return d?d.getUTCDate()+' '+MON[d.getUTCMonth()]:'';}
function fm(s){var d=pd(s);return d?MONL[d.getUTCMonth()]+' '+d.getUTCFullYear():'';}
function fmShort(s){var d=pd(s);return d?MON[d.getUTCMonth()]+' '+d.getUTCFullYear():'';}
function money(n,dec){if(!num(n))return 'n/a';var neg=n<0,a=Math.abs(n);var s=a.toLocaleString('en-AU',{minimumFractionDigits:dec?2:0,maximumFractionDigits:dec?2:0});return (neg?'-':'')+'$'+s;}
function short(n){if(!num(n))return 'n/a';var neg=n<0,a=Math.abs(n),s;
  if(a>=1e6)s='$'+(a/1e6).toFixed(2).replace(/\.?0+$/,'')+'m';
  else if(a>=1000)s='$'+(a/1000).toFixed(a>=1e5?0:1).replace(/\.0$/,'')+'k';
  else s='$'+Math.round(a);
  return (neg?'-':'')+s;}
function pct(n,d){return num(n)?(n*100).toFixed(d==null?1:d).replace(/\.0$/,'')+'%':'n/a';}
function sign(n){return (n>=0?'+':'-')+short(Math.abs(n));}
function dateDiff(a,b){return Math.round((pd(b)-pd(a))/864e5);}
function addYear(s){var d=pd(s);return d?new Date(Date.UTC(d.getUTCFullYear()+1,d.getUTCMonth(),d.getUTCDate())):null;}
function iso(d){return d.toISOString().slice(0,10);}
function setting(name){var r=arr('settings').filter(function(x){return x.setting===name;})[0];return r?r.value:undefined;}
function kv(key){var r=arr('kitty').filter(function(x){return x.key===key;})[0];return r?r.value:undefined;}
function metric(id){return arr('metrics').filter(function(x){return x.metric_id===id;})[0];}
function mv(id){var m=metric(id);return m?m.value:undefined;}
var catById={},acctById={},catHue={};
function indexData(){
  arr('category_list').forEach(function(c){catById[c.category_id]=c.category;});
  arr('accounts').forEach(function(a){acctById[a.account_id]=a.account;});
  var i=0;arr('category_list').forEach(function(c){if(c.flow==='Expense'){catHue[c.category]=Math.round((i*137.5+20)%360);i++;}});
  arr('budget').forEach(function(b){if(catHue[b.category]==null){catHue[b.category]=Math.round((i*137.5+20)%360);i++;}});
}
function hue(name){if(catHue[name]==null){catHue[name]=Math.round((Object.keys(catHue).length*137.5+20)%360);}return catHue[name];}
function dot(name){return '<span class="dot" style="--h:'+hue(name)+'" aria-hidden="true"></span>';}
function tab(where){var s=String(where||'').split(',')[0].trim();return s;}
function emptyMsg(msg){return '<div class="empty">'+esc(msg)+'</div>';}

function dtable(rows,sumLabel,sumVal){
  var h='<div class="scroll"><table class="table"><tbody>';
  rows.forEach(function(r){h+='<tr><td>'+esc(r[0])+'</td><td>'+esc(r[1])+'</td></tr>';});

var LOOK=35;
function renewals(){
  var out=[];if(!AS_OF)return out;
  LOOK=+kv('look_ahead_days')||35;
  arr('subscriptions').forEach(function(s){
    if(s.cadence!=='Annual'||!s.last_charged||s.decision==='Cancel')return;
    var nx=addYear(s.last_charged);if(!nx)return;
    var dd=dateDiff(AS_OF,iso(nx));
    if(dd>=0&&dd<=LOOK)out.push({service:s.service,date:iso(nx),amount:Math.abs(s.latest_charge||s.annual_cost||0),days:dd});
  });
  out.sort(function(a,b){return a.days-b.days;});return out;
}

  function li(x){var amt=Math.abs(x.latest_charge||0);var f=x.usage_flag;var chip=f==='Still charging'?'bad':f==='Unused'?'warn':f==='Cancelled'?'':'good';
   var det=f==='Still charging'?'Cancelled but still being charged. Last charged '+fd(x.last_charged)+'.':f==='Unused'?(typeof x.days_since_used==='number'?'Not used for '+x.days_since_used+' days.':'Never used.')+' Last charged '+fd(x.last_charged)+'.':x.annual_cost_of_price_rise>0?'Price has risen; that adds '+money(x.annual_cost_of_price_rise)+' a year.':'';
   return '<li><span class="nm">'+dot('Subscriptions')+esc(x.service)+'</span><span class="amt">'+money(amt,true)+' '+esc(String(x.cadence).toLowerCase())+'</span><span class="det"><span class="chip '+chip+'">'+esc(f)+'</span> '+esc(det)+'</span></li>';}
  var look=flag.concat(rise);
  if(look.length)h+='<div class="card"><b>Worth a look</b><ul class="list">'+look.map(li).join('')+'</ul></div>';
  var rest=s.filter(function(x){return look.indexOf(x)<0;});
  if(rest.length)h+='<details><summary>'+rest.length+' other subscriptions and bills</summary><ul class="list card">'+rest.map(function(x){return '<li><span class="nm">'+esc(x.service)+'</span><span class="amt">'+(x.annual_cost>0?money(x.annual_cost)+' a year':'No longer charged')+'</span><span class="det">'+esc(x.cadence)+', last charged '+esc(fd(x.last_charged))+'</span></li>';}).join('')+'</ul></details>';
  return h;
}
function savingsHtml(){
  var s=arr('savings');if(!s.length)return emptyMsg('No savings ideas yet.');
  var m=metric('savings.recurring_per_year');
  return '<div class="card">'+(m?'<div class="row"><span class="big">'+short(m.value)+' a year</span><span class="chip est">Estimated</span></div><p class="sub">Plus '+short(mv('savings.one_off'))+' one-off to recover. These are estimates, not money saved yet.</p>':'')+'<ul class="list">'+s.slice().sort(function(a,b){return a.rank-b.rank;}).map(function(x){return '<li><span class="nm">'+esc(x.opportunity)+'</span><span class="amt">'+money(x.estimated_saving)+(x.type==='Recurring'?' a year':' once')+'</span><span class="det">'+esc(x.what_the_data_shows)+'. Effort: '+esc(x.effort.toLowerCase())+'.</span></li>';}).join('')+'</ul></div>';
}
function taxHtml(){
  var t=arr('tax');if(!t.length)return emptyMsg('No tax forecast yet.');
  function f(l){return t.filter(function(r){return r.label===l;})[0];}
  var ti=f('Taxable income'),tt=f('Total tax'),rf=f('Estimated refund (negative means tax payable)'),hh=f('Household refund, both people'),hr=f('Household refund at risk');
  if(!ti||!tt||!rf)return emptyMsg('The tax forecast does not have its main rows yet.');
  var rows=[['Taxable income',ti.prior_j,ti.prior_m,ti.cur_j,ti.cur_m],['Total tax',tt.prior_j,tt.prior_m,tt.cur_j,tt.cur_m],['Refund',rf.prior_j,rf.prior_m,rf.cur_j,rf.cur_m]];
  return '<div class="card"><div class="scroll"><table class="table"><thead><tr><th></th><th>Jordan '+esc(f('Financial year').prior_j)+'</th><th>Mia '+esc(f('Financial year').prior_m)+'</th><th>Jordan '+esc(f('Financial year').cur_j)+'</th><th>Mia '+esc(f('Financial year').cur_m)+'</th></tr></thead><tbody>'+rows.map(function(r){return '<tr><td>'+r[0]+'</td>'+r.slice(1).map(function(v){return '<td>'+money(v)+'</td>';}).join('')+'</tr>';}).join('')+(hh?'<tr class="sum"><td>Household refund</td><td colspan="2">'+money(hh.prior_j)+'</td><td colspan="2">'+money(hh.cur_j)+'</td></tr>':'')+'</tbody></table></div><p class="src"><span class="chip est">Estimate</span> Every figure here is a forecast. '+esc(f('Financial year').cur_j)+' is projected from the year so far.'+(hr?' About '+money(hr.prior_j)+' of last year\'s refund rests on claims flagged for review.':'')+'</p></div>';
}
function loanHtml(){
  var l=arr('loans'),mi=D.mortgage_inputs;if(!l.length)return emptyMsg('No loans listed yet.');
  var h='<div class="card"><ul class="list">'+l.map(function(x){return '<li><span class="nm">'+esc(x.loan)+'</span><span class="amt">'+money(x.balance_at_as_of_date)+'</span><span class="det">'+esc(x.lender)+' · '+pct(x.interest_rate,2)+' · '+esc(x.repayment_type.toLowerCase())+' · about '+money(x.monthly_repayment_calculated)+' a month</span></li>';}).join('')+'</ul>';
  var st=metric('mortgage.stress.monthly'),py=metric('mortgage.payoff_years');
  h+='<p class="src">'+(py?'<span class="chip est">Projection</span> Home loan paid off in about '+py.value.toFixed(1)+' years at today\'s repayment, with the offset. ':'')+(st?'<span class="chip est">Estimate</span> A rate rise of 0.5% would add about '+money(st.value)+' a month.':'')+'</p></div>';
  return h;
}
function activityHtml(){
  var t=arr('transactions');if(!t.length)return emptyMsg('No transactions yet.');
  var rows=t.slice().sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:0;}).slice(0,8);
  return '<ul class="list card">'+rows.map(function(r){var cat=catById[r.category_id]||'Uncategorised';return '<li><span class="nm">'+dot(cat)+esc(r.merchant||r.bank_description)+'</span><span class="amt '+(r.amount>0?'good-t':'')+'">'+(r.amount>0?'+':'')+money(r.amount,true)+'</span><span class="det">'+esc(fd(r.date))+' · '+esc(cat)+' · '+esc(acctById[r.account_id]||'')+(r.person?' · '+esc(r.person):'')+'</span></li>';}).join('')+'</ul>';
}

function safe(fn,label){try{return fn();}catch(e){return '<div class="fail" role="alert">'+esc(label)+' could not be drawn. The rest of the page still works.</div>';}}

function build(){
  window.__dlgs=[];
  var h='<div class="wrap">';
  h+=safe(renderHeader,'The page header');
  h+=safe(renderVerdict,'The summary');
  h+='<section aria-labelledby="h-tiles"><h2 id="h-tiles">The numbers</h2><p class="lead">Tap any number to see what it is made of.</p>'+safe(renderTiles,'The headline numbers')+'</section>';
  var secs=[
   ['goals','Goals','Money as saved so far, against the target.',goalsHtml],
   ['spending','Spending against budget','Year to date, Jul to now. Over means more than 10% above the budget so far.',budgetHtml],
   ['month','Where '+(lastMonthText()||'the latest month')+' went','Biggest categories.',monthSpendHtml],
   ['flow','Income and spending','Month by month.',chartHtml],
   ['nw','Net worth','Month end.',nwHtml],
   ['checks','Checks','Things the sheet looked at for us.',checksHtml],
   ['bills','Bills and subscriptions','What is coming and what to question.',billsHtml],
   ['savings','Savings found','Estimated.',savingsHtml],
   ['tax','Tax forecast','Estimated, not confirmed.',taxHtml],
   ['loans','Loans','',loanHtml],
   ['activity','Latest activity','Newest first.',activityHtml]
  ];
  secs.forEach(function(s){h+='<section id="'+s[0]+'" aria-labelledby="h-'+s[0]+'"><h2 id="h-'+s[0]+'">'+esc(s[1])+'</h2>'+(s[2]?'<p class="lead">'+esc(s[2])+'</p>':'')+safe(s[3],s[1])+'</section>';});
  h+='<footer>This page only reads the sheet; it never changes it. Figures come from the exported data embedded in this file, as of '+esc(asOfText())+'. '+esc(D.fetchedAt?'Exported '+fd(D.fetchedAt)+'.':'')+'</footer></div>';
  app.innerHTML=h;
}

try{
  D=JSON.parse(document.getElementById('kitty-data').textContent);
  AS_OF=setting('As-of date');
  if(typeof AS_OF!=='string')AS_OF=undefined;
  indexData();
  build();
  document.addEventListener('click',function(e){
    var t=e.target.closest&&e.target.closest('[data-dlg]');if(!t)return;
    var fn=window.__dlgs[+t.getAttribute('data-dlg')];
    var body;try{body=fn();}catch(err){body='<div class="fail">This breakdown could not be drawn.</div>';}
    openDlg(t.getAttribute('data-title'),body,t);
  });
}catch(e){
  app.innerHTML='<div class="fail" role="alert" style="margin-top:24px">The data could not be read, so nothing can be shown yet. Swap in a fresh export and reload.</div>';
}
})();
</script>
</body>
</html>

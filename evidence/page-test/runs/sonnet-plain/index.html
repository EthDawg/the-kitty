<style>
:root{color-scheme:light;--bg:#f6f4fb;--card:#fff;--ink:#1d1a2b;--mut:#6a6580;--line:#e6e2f1;--acc:#6d4aff;--good:#1c8a5a;--bad:#c93a3a;--warn:#b97a0a;--soft:#efeaff}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--bg:#14121d;--card:#1e1b2c;--ink:#efecf8;--mut:#a29dba;--line:#2e2a42;--acc:#9b83ff;--good:#4cc790;--bad:#ff7b7b;--warn:#f0b24a;--soft:#2a2545}}
:root[data-theme=dark]{color-scheme:dark;--bg:#14121d;--card:#1e1b2c;--ink:#efecf8;--mut:#a29dba;--line:#2e2a42;--acc:#9b83ff;--good:#4cc790;--bad:#ff7b7b;--warn:#f0b24a;--soft:#2a2545}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif;padding-inline:16px}
main{max-width:1000px;margin:0 auto;padding-block:20px 48px}
h1,h2{font-family:Fraunces,Georgia,serif;font-weight:600;margin:0}
h1{font-size:1.9rem}
h2{font-size:1.25rem;margin-bottom:4px}
.sub{color:var(--mut);font-size:.9rem}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-top:16px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.kpi .l{color:var(--mut);font-size:.8rem}.kpi .v{font-size:1.6rem;font-weight:600;letter-spacing:-.02em}
.kpi .c{font-size:.8rem;color:var(--mut)}
.good{color:var(--good)}.bad{color:var(--bad)}.warn{color:var(--warn)}
.two{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.two>.card{margin-top:16px}
.att{background:var(--soft);border-radius:12px;padding:10px 14px;margin:6px 0}
.att b{font-weight:600}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin:6px 0 2px}
.bar i{display:block;height:100%;background:var(--acc);border-radius:6px}
.bar i.over{background:var(--bad)}.bar i.done{background:var(--good)}
.row{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.tag{font-size:.72rem;padding:2px 8px;border-radius:99px;background:var(--soft);white-space:nowrap}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--mut);font-weight:500;font-size:.78rem}
td.n,th.n{text-align:right;white-space:nowrap}
svg{width:100%;height:auto;display:block}
svg text{fill:var(--mut);font:10px Inter,sans-serif}
.leg{display:flex;gap:14px;font-size:.8rem;color:var(--mut);margin-top:6px}
.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:5px 12px;cursor:pointer}
.err{padding:20px;color:var(--bad)}
@media print{body{background:#fff}}
</style>
</head>

<script>
(function(){
var app=document.getElementById('app'),D;
try{D=JSON.parse(document.getElementById('kitty-data').textContent)}catch(e){app.innerHTML='<p class="err">Could not read the data block.</p>';return}
var G=function(k){return D[k]||[]};
var cur=(G('kitty').filter(function(r){return r.key==='currency'})[0]||{}).value||'AUD';
function kv(k){var r=G('kitty').filter(function(r){return r.key===k})[0];return r?r.value:''}
var fmt=new Intl.NumberFormat('en-AU',{style:'currency',currency:cur,maximumFractionDigits:0});
function m(n){return n==null?'-':fmt.format(n)}
function pc(n,d){return n==null?'-':(n*100).toFixed(d==null?0:d)+'%'}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function mon(s,long){var d=new Date(s+'T00:00:00');return d.toLocaleDateString('en-AU',{month:'short',year:long?'numeric':'2-digit'})}
function dt(s){return new Date(s+'T00:00:00').toLocaleDateString('en-AU',{day:'numeric',month:'short',year:'numeric'})}
var M={};G('metrics').forEach(function(x){M[x.metric_id]=x});
function mv(id){return M[id]?M[id].value:null}
var asof=(G('settings').filter(function(r){return r.setting==='As-of date'})[0]||{}).value;
var cf=G('cashflow'),nw=G('networth'),last=cf[cf.length-1]||{};
var h='';
h+='<header><div><h1>'+esc(kv('household_name')||D.household)+' Kitty</h1><div class="sub">How we are going, as at '+(asof?dt(asof):'')+'. Data exported '+(D.fetchedAt?dt(D.fetchedAt.slice(0,10)):'')+'. Fictional household.</div></div><button id="th" type="button">Light / dark</button></header>';

// KPIs
function kpi(label,val,note,cls){return '<div class="kpi"><div class="l">'+label+'</div><div class="v '+(cls||'')+'">'+val+'</div><div class="c">'+note+'</div></div>'}
var nwm=M['networth.total'];
var k='';
k+=kpi('Net worth',m(mv('networth.total')),'up '+m(nwm.value-nwm.comparison_value)+' on a year ago','');
k+=kpi('Left over last month',m(mv('cashflow.net.month')),'in '+mon(last.month||'2027-01-01')+', 3-month average '+m(M['cashflow.net.month'].comparison_value),mv('cashflow.net.month')>=0?'good':'bad');
var sr=M['cashflow.savings_rate.3m'];
k+=kpi('Savings rate, 3 months',pc(sr.value,1),'same time last year '+pc(sr.comparison_value,1),sr.value<sr.comparison_value?'warn':'good');
var ec=M['emergency.months_covered'];
k+=kpi('Emergency cover',ec.value.toFixed(1)+' months','target '+ec.comparison_value+' months',ec.value<ec.comparison_value?'warn':'good');
k+=kpi('Cash and offset',m(mv('networth.cash')),'a year ago '+m(M['networth.cash'].comparison_value),'');
k+=kpi('Money to find',m(mv('savings.recurring_per_year'))+'/yr','plus '+m(mv('savings.one_off'))+' one-off to recover','');
h+='<div class="grid">'+k+'</div>';

// Attention
var A=[];
var over=G('budget').filter(function(b){return b.status==='Over'});
var behind=G('goals').filter(function(g){return g.status==='Behind'});
var rev=G('compliance').filter(function(c){return c.status==='Review'});
var sp=M['cashflow.spending.3m_avg'];
A.push('Spending is running at <b>'+m(sp.value)+' a month</b> over three months, against '+m(sp.comparison_value)+' a year ago ('+pc(sp.value/sp.comparison_value-1)+' more). The savings rate fell from '+pc(sr.comparison_value)+' to '+pc(sr.value)+'.');
if(over.length)A.push('<b>'+over.length+' budget categories are over</b>: '+over.map(function(b){return esc(b.category)}).join(', ')+'.');
if(behind.length)A.push('<b>'+behind.length+' goals are behind</b>: '+behind.map(function(g){return esc(g.goal)}).join(', ')+'.');
if(rev.length)A.push('<b>'+rev.length+' checks need a look</b>, including '+m(rev.filter(function(c){return c.check.indexOf('duplicate')>-1})[0].amount)+' of possible duplicate charges to dispute and '+m(mv('tax.refund.prior_year')-mv('tax.refund.corrected.prior_year'))+' of last year\'s tax refund resting on flagged claims.');
h+='<section class="card"><h2>What needs attention</h2>'+A.map(function(a){return '<div class="att">'+a+'</div>'}).join('')+'</section>';

// Cashflow chart
function bars(){
 var W=640,H=220,pl=40,pb=24,pt=8,n=cf.length,mx=0;
 cf.forEach(function(r){mx=Math.max(mx,r.income,r.spending)});mx=Math.ceil(mx/5000)*5000;
 var bw=(W-pl)/n,s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Income and spending by month">';
 for(var i=0;i<=4;i++){var y=pt+(H-pt-pb)*(1-i/4);s+='<line x1="'+pl+'" x2="'+W+'" y1="'+y+'" y2="'+y+'" stroke="var(--line)"/><text x="'+(pl-5)+'" y="'+(y+3)+'" text-anchor="end">'+(mx*i/4/1000)+'k</text>'}
 cf.forEach(function(r,i){
  var x=pl+i*bw,ch=H-pt-pb,hi=r.income/mx*ch,hs=r.spending/mx*ch;
  s+='<rect x="'+(x+bw*.12)+'" y="'+(pt+ch-hi)+'" width="'+bw*.36+'" height="'+hi+'" rx="2" fill="var(--good)" opacity=".85"><title>'+mon(r.month,1)+' income '+m(r.income)+'</title></rect>';
  s+='<rect x="'+(x+bw*.5)+'" y="'+(pt+ch-hs)+'" width="'+bw*.36+'" height="'+hs+'" rx="2" fill="var(--acc)"><title>'+mon(r.month,1)+' spending '+m(r.spending)+' (left over '+m(r.net)+')</title></rect>';
  if(i%2===(n-1)%2)s+='<text x="'+(x+bw/2)+'" y="'+(H-8)+'" text-anchor="middle">'+mon(r.month)+'</text>';
 });
 return s+'</svg><div class="leg"><span><i style="background:var(--good)"></i>Money in</span><span><i style="background:var(--acc)"></i>Money out</span></div>';
}
function line(){
 var W=640,H=220,pl=48,pb=24,pt=10,n=nw.length,vals=nw.map(function(r){return r.net_worth}),mn=Math.min.apply(0,vals),mx=Math.max.apply(0,vals);
 mn=Math.floor(mn/50000)*50000;mx=Math.ceil(mx/50000)*50000;
 var ch=H-pt-pb,pts=nw.map(function(r,i){return[pl+(W-pl-8)*i/(n-1),pt+ch*(1-(r.net_worth-mn)/(mx-mn))]});
 var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Net worth by month">';
 for(var i=0;i<=4;i++){var y=pt+ch*(1-i/4);s+='<line x1="'+pl+'" x2="'+W+'" y1="'+y+'" y2="'+y+'" stroke="var(--line)"/><text x="'+(pl-5)+'" y="'+(y+3)+'" text-anchor="end">'+((mn+(mx-mn)*i/4)/1e6).toFixed(2)+'m</text>'}
 var d=pts.map(function(p,i){return(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)}).join('');
 s+='<path d="'+d+'L'+pts[n-1][0]+' '+(pt+ch)+'L'+pts[0][0]+' '+(pt+ch)+'Z" fill="var(--acc)" opacity=".12"/><path d="'+d+'" fill="none" stroke="var(--acc)" stroke-width="2.5" stroke-linejoin="round"/>';
 pts.forEach(function(p,i){s+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="8" fill="transparent"><title>'+mon(nw[i].month_end,1)+': '+m(nw[i].net_worth)+'</title></circle>';if(i%2===(n-1)%2)s+='<text x="'+p[0]+'" y="'+(H-8)+'" text-anchor="middle">'+mon(nw[i].month_end)+'</text>'});
 return s+'<circle cx="'+pts[n-1][0]+'" cy="'+pts[n-1][1]+'" r="4" fill="var(--acc)"/></svg>';
}
h+='<div class="two"><section class="card"><h2>Money in and out</h2><div class="sub">Last '+cf.length+' months. Hover or tap a bar for the numbers.</div>'+bars()+'</section><section class="card"><h2>Net worth</h2><div class="sub">'+m(nw[0].net_worth)+' to '+m(nw[nw.length-1].net_worth)+' since '+mon(nw[0].month_end,1)+'</div>'+line()+'</section></div>';

// Goals
h+='<section class="card"><h2>Goals</h2>'+G('goals').map(function(g){
 var cls=g.status==='Reached'?'done':(g.status==='Behind'?'over':'');
 var tc=g.status==='Reached'?'good':(g.status==='Behind'?'bad':'');
 return '<div style="margin-top:12px"><div class="row"><b>'+esc(g.goal)+'</b><span class="tag '+tc+'">'+esc(g.status)+'</span></div><div class="bar"><i class="'+cls+'" style="width:'+Math.min(100,g.progress*100)+'%"></i></div><div class="sub">'+m(g.balance_now)+' of '+m(g.target_amount)+' ('+pc(g.progress)+'), due '+dt(g.target_date)+(g.status==='Reached'?'.':'. Needs '+m(g.needed_per_month)+' a month; saving '+m(g.saved_per_month_last_3_months)+' a month lately.')+'</div></div>'}).join('')+'</section>';

// Budget
var bud=G('budget').slice().sort(function(a,b){return b.budget_used-a.budget_used});
h+='<section class="card"><h2>Budget, year to date</h2><div class="sub">'+m(mv('budget.ytd_left'))+' left of '+m(M['budget.ytd_left'].comparison_value)+'. Sorted by share of budget used.</div><div class="scroll"><table><tr><th>Category</th><th class="n">Spent</th><th class="n">Budget</th><th>Used</th><th>Status</th></tr>'+bud.map(function(b){
 var c=b.status==='Over'?'bad':(b.status==='Watch'?'warn':'good');
 return '<tr><td>'+esc(b.category)+'</td><td class="n">'+m(b.year_to_date)+'</td><td class="n">'+m(b.budget_to_date)+'</td><td style="min-width:110px"><div class="bar"><i class="'+(b.status==='Over'?'over':'')+'" style="width:'+Math.min(100,b.budget_used*100)+'%"></i></div></td><td class="'+c+'">'+esc(b.status)+' '+pc(b.budget_used)+'</td></tr>'}).join('')+'</table></div></section>';

// Savings
var sv=G('savings').slice().sort(function(a,b){return a.rank-b.rank});
h+='<section class="card"><h2>Savings to chase</h2><div class="sub">Ranked by the sheet.</div><div class="scroll"><table><tr><th>#</th><th>What</th><th>What the data shows</th><th class="n">Worth</th><th>Effort</th></tr>'+sv.map(function(s){return '<tr><td>'+s.rank+'</td><td><b>'+esc(s.opportunity)+'</b></td><td>'+esc(s.what_the_data_shows)+'</td><td class="n">'+m(s.estimated_saving)+(s.type==='Recurring'?'/yr':' once')+'</td><td>'+esc(s.effort)+'</td></tr>'}).join('')+'</table></div></section>';

// Subscriptions + checks
var subs=G('subscriptions').filter(function(s){return s.usage_flag!=='In use'});
var cl='<section class="card"><h2>Subscriptions to deal with</h2><div class="sub">'+mv('subscriptions.unused')+' of '+G('subscriptions').length+' tracked</div><div class="scroll"><table><tr><th>Service</th><th>Flag</th><th>Last used</th><th class="n">Per year</th></tr>'+subs.map(function(s){return '<tr><td>'+esc(s.service)+'<div class="sub">'+esc(s.owner)+', '+esc(s.cadence)+'</div></td><td class="'+(s.usage_flag==='Still charging'?'bad':'warn')+'">'+esc(s.usage_flag)+'</td><td>'+(s.last_used?dt(s.last_used):'never')+'</td><td class="n">'+m(s.saving_if_cancelled||s.annual_cost)+'</td></tr>'}).join('')+'</table></div></section>';
var chk='<section class="card"><h2>Checks to review</h2><div class="sub">'+rev.length+' of '+G('compliance').length+' checks; the rest are fine.</div>'+rev.map(function(c){return '<div class="att"><div class="row"><b>'+esc(c.check)+'</b><span>'+c.items+' item'+(c.items===1?'':'s')+', '+m(c.amount)+'</span></div><div class="sub">'+esc(c.why_it_matters)+'</div></div>'}).join('')+'</section>';
h+='<div class="two">'+cl+chk+'</div>';

// Home loan + accounts
var mi=D.mortgage_inputs||{},hl=G('loans')[0]||{};
var ex=G('mortgage_extra').filter(function(r){return r.extra_per_month>0}).slice(0,3);
var ml='<section class="card"><h2>Home loan</h2><div class="sub">'+m(mi['Loan balance ($)'])+' owing at '+pc(mi['Current interest rate'],2)+', with '+m(mi['Offset balance ($)'])+' in offset. About '+mv('mortgage.payoff_years').toFixed(1)+' years to go at today\'s repayment, against '+M['mortgage.payoff_years'].comparison_value.toFixed(1)+' on the contract.</div><p>If rates rose '+pc(.0025*0+ (G('settings').filter(function(r){return r.setting==='Rate rise used for the stress test'})[0]||{}).value,2)+', repayments would go up about <b>'+m(mv('mortgage.stress.monthly'))+' a month</b>.</p>'+(ex.length?'<table><tr><th>Extra a month</th><th class="n">Years saved</th><th class="n">Interest saved</th></tr>'+ex.map(function(r){return '<tr><td>'+m(r.extra_per_month)+'</td><td class="n">'+r.years_saved.toFixed(1)+'</td><td class="n">'+m(r.interest_saved)+'</td></tr>'}).join('')+'</table>':'')+'</section>';
var ac='<section class="card"><h2>Accounts</h2><div class="scroll"><table><tr><th>Account</th><th>Where</th><th class="n">Balance</th></tr>'+G('accounts').map(function(a){return '<tr><td>'+esc(a.account)+'</td><td>'+esc(a.institution)+'</td><td class="n">'+m(a.balance_at_as_of_date)+'</td></tr>'}).join('')+'</table></div></section>';
h+='<div class="two">'+ml+ac+'</div>';

h+='<section class="card"><h2>Tax</h2><p style="margin:4px 0">Last year\'s household refund is estimated at <b>'+m(mv('tax.refund.prior_year'))+'</b>, but <b class="warn">'+m(mv('tax.refund_at_risk.prior_year'))+'</b> of it rests on flagged claims; corrected it would be about '+m(mv('tax.refund.corrected.prior_year'))+'. This year is projecting <b>'+m(mv('tax.refund.current_year'))+'</b>.</p></section>';

h+='<p class="sub" style="margin-top:24px">Everything on this page is read from the data block inside this file. To update, replace the contents of the kitty-data block with a newer export.</p>';

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Kitty</title>
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{
  color-scheme: light;
  --bg:#f5f3ef; --surface:#ffffff; --surface-2:#f2efe9; --ink:#1d1a21; --ink-2:#3b3640; --muted:#6a6470;
  --line:#e2ddd5; --line-2:#eeeae4;
  --good:#17774b; --good-bg:#e0f1e7; --bad:#b4381f; --bad-bg:#f9e4dd; --watch:#8f5c00; --watch-bg:#f7edd4;
  --accent:#6545cf; --accent-2:#9a85e8; --accent-soft:#ede8fb; --on-accent:#ffffff;
  --series-in:#b9b2c2;
  --radius:14px;
  --shadow:0 1px 2px rgba(29,26,33,.04), 0 6px 18px rgba(29,26,33,.04);
  --font-body:"Inter", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-display:"Fraunces", Georgia, "Times New Roman", serif;
}
html[data-accent="coral"]{--accent:#c2462c;--accent-2:#e7907c;--accent-soft:#fbe8e2}
html[data-accent="teal"]{--accent:#0a7579;--accent-2:#6cbfc1;--accent-soft:#dff1f1}
html[data-accent="lime"]{--accent:#4b7300;--accent-2:#9cc35a;--accent-soft:#ebf3da}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme: dark;
    --bg:#131116; --surface:#1c1920; --surface-2:#24202a; --ink:#f2eef5; --ink-2:#d8d2de; --muted:#a39cab;
    --line:#332e39; --line-2:#29252f;
    --good:#55c993; --good-bg:#15301f; --bad:#f48a72; --bad-bg:#3b1e17; --watch:#e8b85a; --watch-bg:#33280f;
    --accent:#a690f8; --accent-2:#6e57cf; --accent-soft:#2a2341; --on-accent:#140f22;
    --series-in:#5f5868;
    --shadow:none;
  }
  html[data-accent="coral"]{--accent:#f4957f;--accent-2:#b9533c;--accent-soft:#3a231d}
  html[data-accent="teal"]{--accent:#5fcfd1;--accent-2:#1f7f82;--accent-soft:#16302f}
  html[data-accent="lime"]{--accent:#acd660;--accent-2:#5f8a1e;--accent-soft:#25300f}
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--font-body);-webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom,0px)}
a{color:inherit}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:1120px;margin:0 auto;padding-inline:16px}
@media (min-width:720px){.wrap{padding-inline:28px}}
.num,.tnum{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
.good{color:var(--good)} .bad{color:var(--bad)} .watch{color:var(--watch)}

/* header */
.masthead{padding-top:calc(env(safe-area-inset-top,0px) + 22px);padding-bottom:6px}
.brand{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.brand .dot{width:10px;height:10px;border-radius:50%;background:var(--accent)}
.masthead h1{font-family:var(--font-display);font-weight:600;font-size:clamp(30px,6vw,46px);line-height:1.05;letter-spacing:-.015em;margin:8px 0 4px}
.masthead .sub{color:var(--muted);margin:0}

/* nav */
.tabs{position:sticky;top:0;z-index:20;background:var(--bg);background:color-mix(in srgb, var(--bg) 88%, transparent);
  -webkit-backdrop-filter:saturate(1.4) blur(10px);backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top,0px)}
.tabs .wrap{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-block:10px}
.tabs .wrap::-webkit-scrollbar{display:none}
.tabs a{flex:none;text-decoration:none;font-size:13.5px;font-weight:600;color:var(--ink-2);padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface)}
.tabs a.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}

/* sections */
section.block{margin-block:34px;scroll-margin-top:64px}
.sec-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 16px;margin-bottom:12px}
.sec-head h2{font-family:var(--font-display);font-weight:600;font-size:26px;letter-spacing:-.01em;margin:0}
.sec-head p{margin:0;color:var(--muted);font-size:14px}
h3{font-size:15px;margin:0 0 10px;font-weight:700}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);min-width:0}
.grid{display:grid;gap:14px}
@media (min-width:860px){.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g-2-1{grid-template-columns:2fr 1fr}.g-1-1-wide{grid-template-columns:1.25fr 1fr}}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.lede{font-size:17px;line-height:1.6;margin:0}
.lede b{font-weight:650}
.lede + .lede{margin-top:10px}
.big{font-family:var(--font-display);font-weight:600;font-size:30px;line-height:1.1;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.big.xl{font-size:clamp(34px,7vw,46px)}
.fail{border-style:dashed;color:var(--muted)}

/* hero */
.hero{display:grid;gap:14px}
@media (min-width:900px){.hero{grid-template-columns:1.5fr 1fr}}
.needs ul{list-style:none;margin:0;padding:0}
.needs li{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line-2);font-size:14.5px}
.needs li:first-child{border-top:0;padding-top:2px}
.needs .pip{flex:none;width:8px;height:8px;border-radius:50%;margin-top:7px;background:var(--watch)}
.needs .pip.bad{background:var(--bad)} .needs .pip.good{background:var(--good)} .needs .pip.info{background:var(--accent)}
.needs a{color:var(--accent);font-weight:600;text-decoration:none;white-space:nowrap}

/* tiles */
.tiles{display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr));margin-top:14px}
@media (min-width:720px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:1040px){.tiles{grid-template-columns:repeat(6,minmax(0,1fr))}}
.tile{padding:14px 14px 12px}
.tile .t-label{font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:6px;line-height:1.3}
.tile .big{font-size:25px}
.big .unit,.r-v .unit{font-family:var(--font-body);font-size:.5em;font-weight:600;color:var(--muted);letter-spacing:0}
.tile .t-cmp{font-size:12.5px;margin-top:6px;line-height:1.35;color:var(--muted)}
.tile .t-cmp b{font-weight:700}
.tone-good b{color:var(--good)} .tone-bad b{color:var(--bad)}

/* chips */
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;letter-spacing:.01em;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap;vertical-align:1px}
.chip.good{background:var(--good-bg);color:var(--good)}
.chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip.watch{background:var(--watch-bg);color:var(--watch)}
.chip.info{background:var(--accent-soft);color:var(--accent)}

/* bars */
.bar{position:relative;height:8px;border-radius:99px;background:var(--line-2);overflow:hidden}
.bar > i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--accent)}
.bar.good > i{background:var(--good)} .bar.bad > i{background:var(--bad)} .bar.watch > i{background:var(--watch)}
.bar .mark{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink);opacity:.55}

/* goal */
.goal{display:grid;gap:8px;padding:12px 0;border-top:1px solid var(--line-2)}
.goal:first-child{border-top:0;padding-top:0}
.goal .g-top{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.goal .g-name{font-weight:650}
.goal .g-meta{font-size:13px;color:var(--muted)}
.lead-goal .bar{height:12px}

/* rows */
.rows{list-style:none;margin:0;padding:0}
.rows > li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 14px;padding:11px 0;border-top:1px solid var(--line-2);align-items:center}
.rows > li:first-child{border-top:0}
.rows .r-name{font-weight:600;min-width:0;overflow-wrap:anywhere}
.rows .r-meta{font-size:13px;color:var(--muted);grid-column:1/2}
.rows .r-right{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.rows .r-right .small{font-weight:500}
.rows .r-full{grid-column:1/-1}

/* tables */
.tbl{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-inline:-4px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:14px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line-2);text-align:left;vertical-align:top}
th{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
td.n,th.n{text-align:right;white-space:nowrap}
tr.hl td{background:var(--accent-soft)}
details{margin-top:12px}
details > summary{cursor:pointer;font-weight:600;color:var(--accent);list-style:none;display:inline-flex;align-items:center;gap:6px}
details > summary::-webkit-details-marker{display:none}
details > summary::before{content:"";width:7px;height:7px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg);transition:transform .15s}
details[open] > summary::before{transform:rotate(45deg)}
details > .d-body{margin-top:10px}

/* charts */
.chart{width:100%;position:relative}
.chart svg{display:block;overflow:visible}
.chart text{font-family:var(--font-body);font-size:11px;fill:var(--muted)}
.chart .axis{stroke:var(--line);stroke-width:1}
.chart .grid-l{stroke:var(--line-2);stroke-width:1}
.chart .col{fill:transparent;cursor:pointer}
.chart .col:focus{outline:none}
.chart .col.sel{fill:var(--accent-soft)}
.chart .col:focus-visible{stroke:var(--accent);stroke-width:2}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--muted);margin:2px 0 8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.readout{font-size:13.5px;color:var(--ink-2);min-height:20px;margin-top:6px}

/* month detail */
.md-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.md-head h3{margin:0}
.stepper{display:flex;gap:6px}
.stepper button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:16px;line-height:1}
.stepper button:disabled{opacity:.35;cursor:default}
.kv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;font-size:14px}
.kv dt{color:var(--ink-2)} .kv dd{margin:0;text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.kv .tot{border-top:1px solid var(--line);padding-top:6px;font-weight:700;color:var(--ink)}
.hbar{display:grid;grid-template-columns:minmax(90px,1.1fr) 2fr auto;gap:8px;align-items:center;font-size:13.5px;margin:6px 0}
.hbar .bar{height:10px}

/* category trend */
.cat{display:grid;grid-template-columns:minmax(0,1fr) 84px 70px;gap:2px 14px;align-items:center;padding:9px 0;border-top:1px solid var(--line-2)}
.cat:first-of-type{border-top:0}
.cat .c-name{font-weight:600;font-size:14px;min-width:0}
.cat .c-sub{font-size:12.5px;color:var(--muted)}
.cat .c-val{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;font-size:14px}
.cat .c-chg{text-align:right;font-variant-numeric:tabular-nums;font-size:13px}
.spark{display:block}
.cat-head{display:grid;grid-template-columns:minmax(0,1fr) 84px 70px;gap:14px;font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding-bottom:6px;border-bottom:1px solid var(--line)}
.cat-head span:nth-child(n+2){text-align:right}

/* choice chips */
.choices{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 12px}
.choices button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 11px;font-size:13px;font-weight:600;cursor:pointer;font-variant-numeric:tabular-nums}
.choices button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.choices button.flag{border-color:var(--watch)}
.result{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:560px){.result{grid-template-columns:repeat(3,minmax(0,1fr))}}
.result .r-l{font-size:12.5px;color:var(--muted);font-weight:600}
.result .r-v{font-family:var(--font-display);font-size:21px;font-weight:600;font-variant-numeric:tabular-nums}

/* savings & checks */
.opp{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;padding:13px 0;border-top:1px solid var(--line-2);align-items:start}
.opp:first-child{border-top:0;padding-top:2px}
.opp .rank{width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:13px;display:grid;place-items:center}
.opp .o-name{font-weight:650}
.opp .o-why{font-size:13.5px;color:var(--ink-2)}
.opp .o-meta{font-size:12.5px;color:var(--muted);margin-top:4px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.opp .o-amt{text-align:right;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.opp .o-amt .small{display:block;font-weight:500;color:var(--muted)}
.opp .o-adj{grid-column:2/-1;font-size:13px;background:var(--watch-bg);color:var(--ink-2);border-radius:10px;padding:8px 10px;margin-top:6px}
.opp .o-adj b{color:var(--watch)}
.note-card{border-left:4px solid var(--watch)}
.flag-item{padding:12px 0;border-top:1px solid var(--line-2)}
.flag-item:first-child{border-top:0;padding-top:0}
.flag-item h4{margin:0 0 4px;font-size:14.5px}
.flag-item p{margin:0;font-size:14px;color:var(--ink-2)}
.flag-item .effect{margin-top:6px;font-size:13px;color:var(--watch);font-weight:600}
.check{padding:12px 0;border-top:1px solid var(--line-2)}
.check:first-child{border-top:0;padding-top:0}
.check .c-top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
.check .c-name{font-weight:650}
.check p{margin:4px 0 0;font-size:13.5px;color:var(--ink-2)}
.check .c-where{font-size:12.5px;color:var(--muted);margin-top:4px}
.mini-tx{list-style:none;margin:8px 0 0;padding:0;font-size:13px}
.mini-tx li{display:flex;justify-content:space-between;gap:10px;padding:5px 8px;background:var(--surface-2);border-radius:8px;margin-top:4px}
.mini-tx li span:last-child{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}

/* coming up */
.up{list-style:none;margin:0;padding:0}
.up li{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:2px 12px;padding:10px 0;border-top:1px solid var(--line-2);align-items:center}
.up li:first-child{border-top:0;padding-top:2px}
.up .u-date{text-align:center;line-height:1.1}
.up .u-date b{display:block;font-family:var(--font-display);font-size:20px;font-weight:600}
.up .u-date span{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.up .u-name{font-weight:600}
.up .u-meta{font-size:12.5px;color:var(--muted)}
.up .u-amt{font-weight:700;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}

/* transactions */
.filters{display:grid;gap:8px;grid-template-columns:1fr 1fr;margin-bottom:12px}
@media (min-width:760px){.filters{grid-template-columns:2fr 1fr 1fr 1.3fr 1.3fr}}
.filters .full{grid-column:1/-1}
@media (min-width:760px){.filters .full{grid-column:auto}}
.filters input,.filters select{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--surface);min-width:0;font-size:14px}
.filters input:focus,.filters select:focus{outline:2px solid var(--accent);outline-offset:1px}
.tx-sum{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;font-size:13.5px;color:var(--muted);margin-bottom:6px}
.tx-sum label{display:inline-flex;gap:6px;align-items:center;cursor:pointer}
.txl{list-style:none;margin:0;padding:0}
.note-card{scroll-margin-top:70px}
.txl .tm{position:sticky;top:calc(54px + env(safe-area-inset-top,0px));z-index:2;background:var(--surface);display:flex;justify-content:space-between;gap:10px;font-size:12.5px;font-weight:700;color:var(--muted);padding:10px 0 6px;border-bottom:1px solid var(--line);text-transform:uppercase;letter-spacing:.04em}
.txl .tx{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:2px 12px;padding:9px 0;border-bottom:1px solid var(--line-2);align-items:start}
.txl .tx-d{font-family:var(--font-display);font-weight:600;font-size:17px;text-align:center;line-height:1.3}
.txl .tx-m{font-weight:600;min-width:0;overflow-wrap:anywhere}
.txl .tx-meta{font-size:12.5px;color:var(--muted)}
.txl .tx-note{font-size:12.5px;color:var(--ink-2);margin-top:2px}
.txl .tx-a{font-variant-numeric:tabular-nums;font-weight:600;text-align:right;white-space:nowrap}
.txl .tx-a.pos{color:var(--good)}
.txl .tx-a.xfer{color:var(--muted);font-weight:500}
.more{display:block;margin:14px auto 0;padding:10px 18px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;cursor:pointer}
.empty{color:var(--muted);padding:16px 0}

footer{padding-block:20px 48px;color:var(--muted);font-size:13px}
footer p{margin:6px 0}
code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;background:var(--surface-2);padding:1px 5px;border-radius:5px}
@media (prefers-reduced-motion: no-preference){html{scroll-behavior:smooth}}
</style>
</head>
<body>

  <div class="brand"><span class="dot" aria-hidden="true"></span><span id="brand-line">The Kitty</span></div>
  <h1 id="hh-name">Your household</h1>
  <p class="sub" id="hh-sub"></p>
</header>
<nav class="tabs" aria-label="Sections"><div class="wrap" id="tabs"></div></nav>
<main class="wrap" id="app"><p class="muted" style="padding:24px 0">Loading your figures…</p></main>
<footer class="wrap" id="foot"></footer>

  var fyDay = priorFYStart ? priorFYStart.getUTCDate() : 1;

  var CAT = {}, CATBYNAME = {};
  A('category_list').forEach(function (c) { if (c.category_id) { CAT[c.category_id] = c; if (c.category) CATBYNAME[c.category] = c; } });
  function catName(id) { return (CAT[id] && CAT[id].category) || id || 'Uncategorised'; }

  function goalSpend(goal, from, to) {

    if (!words.length) return { total: 0, txns: [] };

    };
    var order = { review: 0, note: 1, ok: 2 };
    var rows = C.slice().sort(function (a, b) { return (order[String(a.status).toLowerCase()] != null ? order[String(a.status).toLowerCase()] : 1) - (order[String(b.status).toLowerCase()] != null ? order[String(b.status).toLowerCase()] : 1); });
    var open = rows.filter(function (c) { return !/^ok$/i.test(c.status); }), ok = rows.filter(function (c) { return /^ok$/i.test(c.status); });
    var one = function (c) {
      var ex = examples(c);
      return '<div class="check"><div class="c-top"><span class="c-name">' + esc(c.check) + '</span><span>' + chip(esc(c.type || ''), '') + ' ' + chip(esc(c.status), statusTone(c.status)) + '</span></div>' +
        (num(c.items) || num(c.amount) ? '<div class="small" style="margin-top:2px"><b>' + dec(c.items, 0) + ' ' + plural(num(c.items), 'item') + '</b>' + (num(c.amount) ? ' · ' + money(c.amount) : '') + '</div>' : '') +
        '<p>' + esc(c.why_it_matters || '') + '</p><div class="c-where">Where to look: ' + esc(c.where_to_look || '') + '</div>' +
        (ex.length ? '<ul class="mini-tx">' + ex.slice(0, 8).map(function (t) {
          return '<li><span>' + fd(parseDate(t.date)) + ' · ' + esc(t.merchant) + (t.note ? ' · <i>' + esc(t.note) + '</i>' : '') + (t.receipt_held ? ' · receipt ' + (t.receipt_held === 'Y' ? 'held' : 'missing') : '') + '</span><span>' + money(t.amount, { dp: 2 }) + '</span></li>';
        }).join('') + '</ul>' : '') + '</div>';
    };
    return '<div class="grid g-1-1-wide"><div class="card"><h3>Needs a look (' + open.length + ')</h3>' + (open.length ? open.map(one).join('') : '<p class="muted">Nothing open.</p>') + '</div>' +
      '<div class="card"><h3>Passed (' + ok.length + ')</h3><ul class="rows">' + ok.map(function (c) {
        return '<li><div class="r-name" style="font-weight:500">' + esc(c.check) + '</div><div class="r-right">' + chip('OK', 'good') + '</div></li>';
      }).join('') + '</ul>' +
      (CHECKS.items.length ? '<div style="margin-top:16px;padding-top:12px;border-top:1px solid var(--line)"><h3>This page’s own checks (' + CHECKS.items.length + ')</h3><p class="small muted" style="margin:0 0 6px">Figures in the sheet that look off when set against its transactions.</p><ul class="rows">' +
        CHECKS.items.map(function (it) {
          return '<li><div class="r-name" style="font-weight:500">' + it.title + '</div><div class="r-right"><a href="#flags-' + it.area + '" style="color:var(--accent);font-weight:600;text-decoration:none">Why&nbsp;→</a></div></li>';
        }).join('') + '</ul></div>' : '') + '</div></div>';
  });

  /* ---------- transactions ---------- */
  var TX = txAll.slice().sort(function (a, b) { return a.date < b.date ? 1 : a.date > b.date ? -1 : (String(a.txn_id) < String(b.txn_id) ? 1 : -1); });
  var txState = { q: '', month: '', person: '', cat: '', acc: '', xfer: false, limit: 60 };
  section('transactions', 'Transactions', 'Transactions', function () { return TX.length ? TX.length + ' from ' + fd(parseDate(TX[TX.length - 1].date)) + ' to ' + fd(parseDate(TX[0].date)) : ''; }, function () {
    if (!TX.length) return '<div class="card muted">No transactions in the sheet.</div>';
    var months = []; TX.forEach(function (t) { var m = String(t.date).slice(0, 7); if (months.indexOf(m) < 0) months.push(m); });
    var persons = []; TX.forEach(function (t) { if (t.person && persons.indexOf(t.person) < 0) persons.push(t.person); });
    persons.sort(function (a, b) { return (people.indexOf(a) < 0 ? 99 : people.indexOf(a)) - (people.indexOf(b) < 0 ? 99 : people.indexOf(b)); });
    var cats = []; TX.forEach(function (t) { if (t.category_id && cats.indexOf(t.category_id) < 0) cats.push(t.category_id); });
    cats.sort(function (a, b) { return catName(a).localeCompare(catName(b)); });
    var accs = []; TX.forEach(function (t) { if (t.account_id && accs.indexOf(t.account_id) < 0) accs.push(t.account_id); });
    var opt = function (v, l) { return '<option value="' + esc(v) + '">' + esc(l) + '</option>'; };
    AFTER.push(renderTx);
    return '<div class="card"><div class="filters">' +
      '<input class="full" type="search" id="tx-q" placeholder="Search merchant, description or note" aria-label="Search transactions">' +
      '<select id="tx-month" aria-label="Month">' + opt('', 'All months') + months.map(function (m) { return opt(m, fd(parseDate(m + '-01'), 'mly')); }).join('') + '</select>' +
      '<select id="tx-person" aria-label="Person">' + opt('', 'Everyone') + persons.map(function (p) { return opt(p, p); }).join('') + '</select>' +
      '<select id="tx-cat" aria-label="Category">' + opt('', 'All categories') + cats.map(function (c) { return opt(c, catName(c)); }).join('') + '</select>' +
      '<select id="tx-acc" aria-label="Account">' + opt('', 'All accounts') + accs.map(function (a) { return opt(a, accName(a)); }).join('') + '</select>' +
      '</div><div class="tx-sum" id="tx-sum"></div><ul class="txl" id="tx-list"></ul><div id="tx-more"></div></div>';
  });
  function txMatches(t) {
    var s = txState;
    if (!s.xfer && !s.cat && isTransfer(t)) return false;
    if (s.month && String(t.date).slice(0, 7) !== s.month) return false;
    if (s.person && t.person !== s.person) return false;
    if (s.cat && t.category_id !== s.cat) return false;
    if (s.acc && t.account_id !== s.acc) return false;
    if (s.q) {
      var hay = [t.merchant, t.bank_description, t.note, catName(t.category_id), t.txn_id].join(' ').toLowerCase();
      if (hay.indexOf(s.q) < 0) return false;
    }
    return true;
  }
  function renderTx() {
    var list = document.getElementById('tx-list'); if (!list) return;
    var rows = TX.filter(txMatches);
    var spend = rows.filter(function (t) { return !isTransfer(t); });
    var tin = sum(spend.filter(function (t) { return num(t.amount) > 0; }).map(function (t) { return t.amount; }));
    var tout = -sum(spend.filter(function (t) { return num(t.amount) < 0; }).map(function (t) { return t.amount; }));
    var xferCount = TX.filter(isTransfer).length;
    document.getElementById('tx-sum').innerHTML = '<span><b style="color:var(--ink)">' + rows.length + '</b> ' + plural(rows.length, 'transaction') + '</span><span>in <b class="good">' + money(tin) + '</b></span><span>out <b style="color:var(--ink)">' + money(tout) + '</b></span>' +
      (!txState.cat ? '<label><input type="checkbox" id="tx-xfer"' + (txState.xfer ? ' checked' : '') + '> show ' + xferCount + ' transfers between your accounts</label>' : '');
    var shown = rows.slice(0, txState.limit);
    var html = '', curM = '';
    var monthTotals = {};
    rows.forEach(function (t) { var m = String(t.date).slice(0, 7); var a = num(t.amount) || 0; if (isTransfer(t)) return; monthTotals[m] = monthTotals[m] || { i: 0, o: 0 }; if (a > 0) monthTotals[m].i += a; else monthTotals[m].o -= a; });
    shown.forEach(function (t) {
      var m = String(t.date).slice(0, 7);
      if (m !== curM) {
        curM = m;
        var mt = monthTotals[m] || { i: 0, o: 0 };
        html += '<li class="tm"><span>' + fd(parseDate(m + '-01'), 'mly') + '</span><span>in ' + money(mt.i) + ' · out ' + money(mt.o) + '</span></li>';
      }
      var a = num(t.amount) || 0, xf = isTransfer(t);
      var bits = [];
      if (t.note) bits.push(esc(t.note));
      if (t.receipt_held === 'Y') bits.push('receipt held'); else if (t.receipt_held === 'N') bits.push('<span class="bad">no receipt</span>');
      html += '<li class="tx"><div class="tx-d">' + parseDate(t.date).getUTCDate() + '</div><div><div class="tx-m">' + esc(t.merchant || t.bank_description) + '</div>' +
        '<div class="tx-meta">' + esc([catName(t.category_id), accName(t.account_id), t.person].filter(Boolean).join(' · ')) + '</div>' + (bits.length ? '<div class="tx-note">' + bits.join(' · ') + '</div>' : '') + '</div>' +
        '<div class="tx-a ' + (xf ? 'xfer' : a > 0 ? 'pos' : '') + '">' + (a > 0 ? '+' : '') + money(a, { dp: 2 }) + '</div></li>';
    });
    list.innerHTML = html || '<li class="empty">Nothing matches those filters.</li>';
    document.getElementById('tx-more').innerHTML = rows.length > txState.limit ? '<button type="button" class="more" id="tx-more-btn">Show more (' + (rows.length - txState.limit) + ' left)</button>' : '';
  }

  /* ======================================================================
     Render
     ====================================================================== */
  document.title = householdName + ' · The Kitty';
  document.getElementById('hh-name').textContent = householdName;
  document.getElementById('brand-line').textContent = 'The Kitty' + (D.household && D.household !== householdName ? ' · ' + D.household : '');
  document.getElementById('hh-sub').innerHTML = 'Hi ' + esc(greetName) + '. Here’s how you’re going, with figures to <b>' + fd(asOf, 'long') + '</b>.';

  var html = '', navHTML = '';
  SECTIONS.forEach(function (s) {
    var body, sub = '';
    try { body = s.fn(); sub = typeof s.sub === 'function' ? s.sub() : (s.sub || ''); }
    catch (e) { body = '<div class="card fail">This part couldn’t be drawn from the data (' + esc(e && e.message || e) + '). The rest of the page is unaffected.</div>'; if (window.console) console.error(s.id, e); }
    html += '<section class="block" id="' + s.id + '">' + (s.title ? '<div class="sec-head"><h2>' + esc(s.title) + '</h2>' + (sub ? '<p>' + sub + '</p>' : '') + '</div>' : '') + body + '</section>';
    navHTML += '<a href="#' + s.id + '" data-nav="' + s.id + '">' + esc(s.nav) + '</a>';
  });
  app.innerHTML = html;
  document.getElementById('tabs').innerHTML = navHTML;
  AFTER.forEach(function (fn) { try { fn(); } catch (e) { if (window.console) console.error(e); } });

  /* footer: every measure and setting, for reference */
  (function () {
    var f = document.getElementById('foot');
    var tabs = Object.keys(D).filter(function (k) { return Array.isArray(D[k]); }).map(function (k) { return esc(k) + ' (' + D[k].length + ')'; });
    var met = A('metrics');
    var metHTML = met.length ? '<details><summary>Every measure in the sheet (' + met.length + ')</summary><div class="d-body tbl card"><table><thead><tr><th>Measure</th><th class="n">Value</th><th>Period</th><th>Compared with</th></tr></thead><tbody>' +
      met.map(function (m) { var c = compareInfo(m); return '<tr><td>' + esc(m.metric) + '</td><td class="n">' + fmtUnit(m.value, m.unit) + '</td><td>' + esc(m.period || '') + '</td><td class="small">' + (c ? c.html : '') + '</td></tr>'; }).join('') + '</tbody></table></div></details>' : '';
    var setHTML = A('settings').length ? '<details><summary>Sheet settings (' + A('settings').length + ')</summary><div class="d-body tbl card"><table><thead><tr><th>Setting</th><th>Value</th><th>Note</th></tr></thead><tbody>' +
      A('settings').map(function (s) { return '<tr><td>' + esc(s.setting) + '</td><td class="tnum">' + esc(s.value) + '</td><td class="small muted">' + esc(s.note || '') + '</td></tr>'; }).join('') + '</tbody></table></div></details>' : '';
    var fetched = D.fetchedAt ? new Date(D.fetchedAt) : null;
    f.innerHTML = metHTML + setHTML +
      '<p style="margin-top:20px">Figures to ' + fd(asOf, 'long') + (fetched && !isNaN(fetched) ? ' · exported ' + esc(new Intl.DateTimeFormat(locale, { day: 'numeric', month: 'short', year: 'numeric' }).format(fetched)) : '') + ' · ' + esc(D.household || householdName) + '.</p>' +
      '<p>Everything on this page is read from the <code>kitty-data</code> block inside this file: ' + tabs.join(', ') + '. To refresh it, paste a newer kitty.json export into that block.</p>' +
      '<p>Tax figures are estimates from the sheet, not tax advice.</p>';
  })();

  /* ---------- interaction ---------- */
  document.addEventListener('click', function (e) {
    var t = e.target.closest ? e.target.closest('[data-i],[data-cf],[data-nw],[data-mr],[data-me],#tx-more-btn') : null;
    if (!t) return;
    if (t.hasAttribute('data-i')) selectCF(+t.getAttribute('data-i'));
    else if (t.hasAttribute('data-cf')) selectCF(cfSel + +t.getAttribute('data-cf'));
    else if (t.hasAttribute('data-nw')) { nwSel = +t.getAttribute('data-nw'); drawNW(); }
    else if (t.hasAttribute('data-mr')) { mrSel = +t.getAttribute('data-mr'); renderMR(); }
    else if (t.hasAttribute('data-me')) { meSel = +t.getAttribute('data-me'); renderME(); }
    else if (t.id === 'tx-more-btn') { txState.limit += 100; renderTx(); }
  });
  document.addEventListener('keydown', function (e) {
    var t = e.target;
    if (!(t && t.getAttribute)) return;
    if ((e.key === 'Enter' || e.key === ' ') && (t.hasAttribute('data-i') || t.hasAttribute('data-nw'))) { e.preventDefault(); t.dispatchEvent(new MouseEvent('click', { bubbles: true })); }
    if ((e.key === 'ArrowLeft' || e.key === 'ArrowRight') && t.hasAttribute('data-i')) {
      e.preventDefault(); selectCF(cfSel + (e.key === 'ArrowRight' ? 1 : -1));
      var el = document.querySelector('#cf-chart [data-i="' + cfSel + '"]'); if (el && el.focus) el.focus();
    }
    if ((e.key === 'ArrowLeft' || e.key === 'ArrowRight') && t.hasAttribute('data-nw')) {
      e.preventDefault(); nwSel = Math.max(0, Math.min(NW.length - 1, nwSel + (e.key === 'ArrowRight' ? 1 : -1))); drawNW();
      var el2 = document.querySelector('#nw-chart [data-nw="' + nwSel + '"]'); if (el2 && el2.focus) el2.focus();
    }
  });
  var qTimer;
  document.addEventListener('input', function (e) {
    var id = e.target && e.target.id;
    if (id === 'tx-q') { clearTimeout(qTimer); qTimer = setTimeout(function () { txState.q = e.target.value.trim().toLowerCase(); txState.limit = 60; renderTx(); }, 120); }
  });
  document.addEventListener('change', function (e) {
    var id = e.target && e.target.id;
    var map = { 'tx-month': 'month', 'tx-person': 'person', 'tx-cat': 'cat', 'tx-acc': 'acc' };
    if (map[id]) { txState[map[id]] = e.target.value; txState.limit = 60; renderTx(); }
    if (id === 'tx-xfer') { txState.xfer = e.target.checked; txState.limit = 60; renderTx(); }
  });

  /* redraw charts when the width changes (phone rotation, window resize) */
  var lastW = 0, rT;
  function redraw() { var w = (document.getElementById('cf-chart') || {}).clientWidth || 0; if (w && w !== lastW) { lastW = w; try { drawCashflow(); drawNW(); } catch (e) {} } }
  if (window.ResizeObserver) { var ro = new ResizeObserver(function () { cancelAnimationFrame(rT); rT = requestAnimationFrame(redraw); }); ['cf-chart', 'nw-chart'].forEach(function (id) { var el = document.getElementById(id); if (el) ro.observe(el); }); }
  else window.addEventListener('resize', function () { clearTimeout(rT); rT = setTimeout(redraw, 150); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { lastW = 0; redraw(); });

  /* highlight the section in view */
  if (window.IntersectionObserver) {
    var links = {}; Array.prototype.forEach.call(document.querySelectorAll('[data-nav]'), function (a) { links[a.getAttribute('data-nav')] = a; });
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        if (!en.isIntersecting) return;
        Object.keys(links).forEach(function (k) { links[k].classList.toggle('on', k === en.target.id); });
        var a = links[en.target.id];
        if (a && a.parentNode && a.parentNode.scrollTo) { var p = a.parentNode; p.scrollTo({ left: a.offsetLeft - p.clientWidth / 2 + a.clientWidth / 2, behavior: 'smooth' }); }
      });
    }, { rootMargin: '-45% 0px -50% 0px' });
    SECTIONS.forEach(function (s) { var el = document.getElementById(s.id); if (el) io.observe(el); });
  }
})();
</script>
</body>
</html>

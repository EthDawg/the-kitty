<!doctype html>
<html lang="en-AU" class="loading">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>The Kitty</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600;700&display=optional">
<style>
:root{
  color-scheme:light;
  --bg:#f5f3ee;--surface:#ffffff;--surface-2:#f1eee8;--hover:#f7f5f1;
  --ink:#1c1a21;--ink-2:#575363;--line:#e5e1d9;--bar:#c9c4d3;
  --good:#17774a;--good-bg:#e3f3ea;--warn:#965500;--warn-bg:#fcefd9;--bad:#b0261d;--bad-bg:#fce6e3;--note:#475164;--note-bg:#eceff4;
  --accent-l:#5b43cf;--accent-d:#ab98ff;--accent:var(--accent-l);
  --shadow:0 1px 2px rgba(24,18,44,.05),0 6px 18px rgba(24,18,44,.04);
  --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --serif:'Fraunces',Georgia,'Times New Roman',serif;
}
:root[data-accent="coral"]{--accent-l:#b7412a;--accent-d:#ff9580}
:root[data-accent="teal"]{--accent-l:#0b746f;--accent-d:#5ad3c8}
:root[data-accent="lime"]{--accent-l:#47700c;--accent-d:#aee45a}
@media (prefers-color-scheme:dark){
  :root{
    color-scheme:dark;
    --bg:#111015;--surface:#1a1920;--surface-2:#25232c;--hover:#211f28;
    --ink:#f1eff6;--ink-2:#b5b0c2;--line:#302d39;--bar:#57526a;
    --good:#62d49c;--good-bg:#142e20;--warn:#f1b552;--warn-bg:#352612;--bad:#ff8c80;--bad-bg:#3a1815;--note:#c4cbd8;--note-bg:#252a34;
    --accent:var(--accent-d);
    --shadow:none;
  }
}
*,*::before,*::after{box-sizing:border-box}
html{scrollbar-gutter:stable;-webkit-text-size-adjust:100%;text-size-adjust:100%}
html:has(dialog[open]){overflow:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--font);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
.loading .wrap{visibility:hidden;animation:reveal 0s 2.5s forwards}
@keyframes reveal{to{visibility:visible}}
h1,h2,h3,p{margin:0}
button,select,input{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}

.wrap{max-width:1120px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-right)) calc(48px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
@media (min-width:720px){.wrap{padding-top:32px;padding-left:max(24px,env(safe-area-inset-left));padding-right:max(24px,env(safe-area-inset-right))}}

/* header */
.top{display:grid;gap:6px;margin-bottom:16px}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px;color:var(--accent)}
.brand svg{width:22px;height:22px;flex:none}
.top h1{font-family:var(--serif);font-weight:600;font-size:30px;line-height:1.15;letter-spacing:-.01em}
.hello{color:var(--ink-2)}
.status{display:flex;flex-wrap:wrap;gap:8px;list-style:none;padding:0;margin:8px 0 0}

/* chips and tags */
.chip{display:inline-flex;align-items:center;gap:6px;min-height:28px;padding:2px 10px;border-radius:999px;font-size:14px;line-height:1.3;font-weight:500;background:var(--surface-2);color:var(--ink-2);white-space:nowrap;text-decoration:none}
.chip.t-good{background:var(--good-bg);color:var(--good)}
.chip.t-warn{background:var(--warn-bg);color:var(--warn)}
.chip.t-bad{background:var(--bad-bg);color:var(--bad)}
.chip.t-note{background:var(--note-bg);color:var(--note)}
a.chip:hover{text-decoration:underline}
.est{display:inline-flex;align-items:center;min-height:24px;padding:0 8px;border-radius:6px;border:1px dashed currentColor;color:var(--ink-2);font:500 14px/1.2 var(--font);letter-spacing:0;white-space:nowrap;vertical-align:middle}

/* layout */
.cols{display:grid;gap:16px;margin-top:16px}
.col{display:grid;gap:16px;align-content:start;min-width:0}
@media (min-width:980px){.cols{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 16px;box-shadow:var(--shadow);min-width:0}
@media (min-width:720px){.card{padding:22px 24px}}
#sec-activity{margin-top:16px}
.card>h2{font-size:18px;line-height:1.3;font-weight:600;margin-bottom:10px}
.lead{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.lead-sub{color:var(--ink-2);margin-top:4px}
.big{font-size:30px;line-height:1.15;font-weight:700;letter-spacing:-.02em;white-space:nowrap}
.numbtn{background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:left;text-decoration:underline dotted;text-decoration-thickness:2px;text-underline-offset:6px;text-decoration-color:var(--bar);border-radius:6px}
.numbtn:hover{text-decoration-color:var(--accent)}
.empty{color:var(--ink-2);padding:10px 0}
.broken{color:var(--bad);padding:6px 0}
.note{color:var(--ink-2);font-size:14px;margin-top:10px}
.gap{margin-top:14px}

/* hero */
.hero{padding:22px 18px}
@media (min-width:720px){.hero{padding:28px 28px}}
.eyebrow{font-size:14px;color:var(--ink-2);font-weight:500}
.card>h2.verdict{margin-bottom:0;font-family:var(--serif);font-weight:600;font-size:clamp(34px,9vw,50px);line-height:1.08;letter-spacing:-.01em;margin-top:2px}
.reason{font-size:18px;line-height:1.45;margin-top:8px;max-width:46ch}
.t-good{color:var(--good)}.t-warn{color:var(--warn)}.t-bad{color:var(--bad)}.t-note{color:var(--note)}.t-accent{color:var(--accent)}
.needs-label{font-size:14px;font-weight:600;color:var(--ink-2);margin:18px 0 2px}
.hero .rows{max-width:760px}

/* rows */
.rows{list-style:none;margin:0;padding:0}
.rows>li+li{border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto 14px;align-items:center;column-gap:12px;min-height:56px;padding:10px 0;width:100%;text-align:left;background:none;border:0;border-radius:10px}
.row.nolead{grid-template-columns:minmax(0,1fr) auto 14px}
button.row{cursor:pointer;padding-left:6px;padding-right:6px;margin:0 -6px;width:calc(100% + 12px);transition:background-color .15s ease}
button.row:hover{background:var(--hover)}
.row-main{min-width:0;display:flex;flex-direction:column;gap:2px}
.row-title{font-weight:600;overflow-wrap:anywhere}
.row-sub,.row-note{font-size:14px;line-height:1.4;color:var(--ink-2);overflow-wrap:anywhere}
.row-val{font-weight:600;text-align:right;white-space:nowrap}
.row-val.t-good{color:var(--good)}.row-val.t-warn{color:var(--warn)}.row-val.t-bad{color:var(--bad)}
.chev{color:var(--ink-2);font-size:22px;line-height:1;text-align:center}
@media (max-width:520px){
  .row.stack{grid-template-columns:auto minmax(0,1fr) 14px;row-gap:2px}
  .row.stack.nolead{grid-template-columns:minmax(0,1fr) 14px}
  .row.stack>.ico,.row.stack>.sw,.row.stack>.dot{grid-row:1 / span 2;align-self:start;margin-top:2px}
  .row.stack>.row-val{grid-row:2;grid-column:2;text-align:left}
  .row.stack.nolead>.row-val{grid-column:1}
  .row.stack>.chev{grid-row:1 / span 2;grid-column:3}
  .row.stack.nolead>.chev{grid-column:2}
}
.row.total{min-height:48px;border-top:2px solid var(--line)}
.row.total .row-title,.row.total .row-val{font-weight:700}
.sw{display:block;width:12px;height:12px;border-radius:4px;background:var(--cat,var(--bar))}
.dot{display:block;width:10px;height:10px;border-radius:50%;background:currentColor}
.ico{display:grid;place-items:center;width:36px;height:36px;border-radius:12px;background:var(--surface-2);color:var(--ink-2)}
.ico svg{width:20px;height:20px}
.ico.t-warn{background:var(--warn-bg);color:var(--warn)}
.ico.t-bad{background:var(--bad-bg);color:var(--bad)}
.ico.t-good{background:var(--good-bg);color:var(--good)}
.bar{display:block;height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden;margin-top:6px}
.bar>span{display:block;height:100%;border-radius:inherit;background:var(--cat,var(--accent))}
.bar>span.f-good{background:var(--good)}.bar>span.f-warn{background:var(--warn)}.bar>span.f-accent{background:var(--accent)}
details.more{margin-top:2px}
details.more>summary{cursor:pointer;list-style:none;display:flex;align-items:center;min-height:48px;color:var(--accent);font-weight:600;border-top:1px solid var(--line)}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::after{content:"";width:8px;height:8px;margin-left:10px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg) translateY(-3px)}
details.more[open]>summary::after{transform:rotate(-135deg) translateY(-1px)}
details.more[open]>summary{border-bottom:1px solid var(--line)}

/* goals */
.goals{list-style:none;margin:0;padding:0}
.goals>li+li{border-top:1px solid var(--line)}
.goal{display:block;width:calc(100% + 12px);margin:0 -6px;padding:14px 6px;text-align:left;background:none;border:0;border-radius:10px;cursor:pointer;transition:background-color .15s ease}
.goal:hover{background:var(--hover)}
.goal-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.goal-name{font-weight:600;overflow-wrap:anywhere}
.goal-money{display:block;margin-top:4px;color:var(--ink-2)}
.goal-money b{color:var(--ink);font-size:22px;font-weight:700;letter-spacing:-.01em}
.goal.is-lead .goal-money b{font-size:30px}
.goal .bar{height:10px;margin-top:8px}
.goal-sub{display:block;font-size:14px;color:var(--ink-2);margin-top:8px}
.goal-kicker{display:block;font-size:14px;color:var(--ink-2);font-weight:500;margin-bottom:2px}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{display:flex;flex-direction:column;gap:2px;min-height:100px;padding:12px 10px;border:0;border-radius:12px;background:var(--surface-2);text-align:left;cursor:pointer;transition:background-color .15s ease}
.tile:hover{background:var(--hover);box-shadow:inset 0 0 0 1px var(--line)}
.tile-label{font-size:14px;color:var(--ink-2);font-weight:500}
.tile-val{font-size:clamp(20px,5.6vw,26px);line-height:1.2;font-weight:700;letter-spacing:-.02em;white-space:nowrap}
.tile-sub{font-size:14px;line-height:1.35;color:var(--ink-2)}
.tile-val.none{font-size:18px;white-space:normal}
@media (min-width:720px){.tile{padding:14px 14px}}

/* chart */
.chart{position:relative;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));column-gap:3px;height:170px;align-items:end;margin-top:14px;border-bottom:1px solid var(--line)}
.colb{position:relative;height:100%;display:flex;align-items:flex-end;justify-content:center;border:0;background:none;padding:0;cursor:pointer;border-radius:6px 6px 0 0;min-width:0}
.colb:hover{background:var(--hover)}
.colb .out{display:block;width:100%;max-width:30px;border-radius:4px 4px 0 0;background:var(--bar)}
.colb.neg .out{background:var(--warn)}
.colb .in{position:absolute;left:6%;right:6%;height:3px;border-radius:2px;background:var(--accent);transform:translateY(50%)}
.axis{position:relative;height:22px;margin-top:6px;font-size:14px;color:var(--ink-2)}
.axis span{position:absolute;top:0;white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:14px;color:var(--ink-2)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:6px}
.legend i.l-in{height:3px;vertical-align:3px;background:var(--accent)}
.legend i.l-out{background:var(--bar)}
.legend i.l-neg{background:var(--warn)}

/* sparkline */
.spark{display:block;width:100%;height:64px;margin:14px 0 4px}
.spark .line{fill:none;stroke:var(--accent);stroke-width:2;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.spark .area{fill:var(--accent);opacity:.12}
.spark-ends{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 12px;font-size:14px;color:var(--ink-2);margin-bottom:6px}

/* activity */
.controls{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:flex-end;margin-bottom:8px}
.field{display:grid;gap:4px;font-size:14px;color:var(--ink-2);font-weight:500}
.field select{min-height:44px;padding:8px 36px 8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);color:var(--ink);font-size:16px;appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-2) 50%),linear-gradient(135deg,var(--ink-2) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.pill{min-height:44px;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.checkline{display:flex;align-items:center;gap:10px;min-height:44px;font-size:15px;color:var(--ink-2);cursor:pointer}
.checkline input{width:20px;height:20px;accent-color:var(--accent)}
.act-sum{color:var(--ink-2);font-size:15px;padding:6px 0 4px}

/* footer */
.foot{margin-top:24px;color:var(--ink-2);font-size:15px;display:grid;gap:6px;max-width:70ch}

/* drawer */
dialog#drawer{position:fixed;top:auto;right:0;bottom:0;left:0;margin:0;padding:0;border:0;width:100%;max-width:100%;max-height:90vh;max-height:90dvh;border-radius:20px 20px 0 0;background:var(--surface);color:var(--ink);box-shadow:0 -10px 40px rgba(0,0,0,.25)}
dialog#drawer[open]{display:flex;flex-direction:column;animation:sheet-up .22s ease-out}
dialog#drawer::backdrop{background:rgba(12,10,22,.45)}
@keyframes sheet-up{from{transform:translateY(20px);opacity:0}to{transform:none;opacity:1}}
@keyframes sheet-left{from{transform:translateX(20px);opacity:0}to{transform:none;opacity:1}}
@media (min-width:760px){
  dialog#drawer{top:0;left:auto;width:min(480px,100%);height:100%;max-height:100%;border-radius:0;box-shadow:-10px 0 40px rgba(0,0,0,.2)}
  dialog#drawer[open]{animation-name:sheet-left}
}
.dr-head{flex:none;display:flex;align-items:center;gap:8px;padding:12px 12px 12px 18px;border-bottom:1px solid var(--line)}
.dr-head h2{flex:1;min-width:0;font-size:18px;line-height:1.3;font-weight:600;outline-offset:4px}
.dr-close,.dr-back{flex:none;min-width:44px;height:44px;border-radius:12px;border:0;background:var(--surface-2);cursor:pointer;font-size:16px;font-weight:600;padding:0 12px}
.dr-close:hover,.dr-back:hover{background:var(--hover);box-shadow:inset 0 0 0 1px var(--line)}
.dr-body{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;padding:16px 18px calc(28px + env(safe-area-inset-bottom))}
.dr-lead{margin-bottom:6px}
.dr-lead .big{font-size:32px;white-space:normal}
.dr-lead-label{color:var(--ink-2);margin-top:4px}
.dr-intro{margin:8px 0 4px}
.dr-group{margin-top:18px}
.dr-group>h3{font-size:15px;font-weight:600;color:var(--ink-2);margin-bottom:2px}
.source{margin-top:20px;padding-top:12px;border-top:1px solid var(--line);color:var(--ink-2);font-size:14px}
.g3{display:grid;grid-template-columns:minmax(0,1fr) minmax(76px,auto) minmax(76px,auto);column-gap:12px;align-items:baseline;padding:9px 0}
.g3>span:not(:first-child){text-align:right;white-space:nowrap;font-weight:600}
.g3.head>span{font-weight:600;color:var(--ink-2);font-size:14px}
.g3.strong>span{font-weight:700}
.g3 .lbl{overflow-wrap:anywhere}
.g3 .how{display:block;font-size:14px;color:var(--ink-2);font-weight:400}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
  .loading .wrap{visibility:visible}
}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
</style>

doc.addEventListener('change', function (e) {
  if (!e.target) return;
  if (e.target.id === 'act-month') { ACT.month = e.target.value; fillActivity(); }
  if (e.target.id === 'act-transfers') { ACT.transfers = !!e.target.checked; fillActivity(); }
});

if (TEST) { TEST.REG = REG; TEST.drawer = function (k) { return REG[k](); }; }
}
})();
</script>
